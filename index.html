<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Password Generator</h2>

        <input type="text" id="password" readonly>

        <label>Password Length: <span id="lenDisplay">12</span></label>
        <input type="range" id="length" min="6" max="32" value="12">

        <div class="options">
            <label><input type="checkbox" id="upper" checked> Uppercase</label>
            <label><input type="checkbox" id="lower" checked> Lowercase</label>
            <label><input type="checkbox" id="number" checked> Numbers</label>
            <label><input type="checkbox" id="symbol" checked> Symbols</label>
        </div>

        <button onclick="generatePassword()">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
